name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full git history for nx release to work properly
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest main (a previous release run may have pushed)
        run: git pull --rebase origin main

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: nrwl/nx-set-shas@v5

      - run: pnpm exec nx affected -t docker:build

      # Apps are deployed, not published to npm: each release tags the app’s Docker image and
      # pushes it to the registry. Only affected apps are released, because ‘nx release’ tags
      # an image for every project it processes and the step above builds only the affected ones.
      - run: |
          # Without pipefail, a failing ‘nx show projects’ reads as ‘no apps affected’.
          set -o pipefail
          AFFECTED=$(pnpm exec nx show projects --affected --projects "tag:release:docker" --json | jq -r 'join(",")')
          if [ -n "$AFFECTED" ]; then
            pnpm exec nx release --yes --projects="$AFFECTED" --dockerVersionScheme=production
          else
            echo "No apps affected; skipping release."
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }} # Needed for pushing release commits and creating GitHub releases.
